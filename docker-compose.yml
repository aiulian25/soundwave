#version: '3.8'

services:
  soundwave:
    container_name: soundwave
    # Option 1: Pull from GitHub Container Registry (recommended for users)
    # image: ghcr.io/aiulian25/soundwave:main
    # Option 2: Build locally (uncomment if pulling fails or for development)
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"  # Run as host user to prevent file ownership issues
    # Security: drop all capabilities and prevent privilege escalation
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8889:8888"
    volumes:
      - ./audio:/app/audio
      - ./cache:/app/cache
      - ./data:/app/data
      # YouTube session for yt-dlp (Netscape format). Without it YouTube answers server
      # requests with "Sign in to confirm you're not a bot". Writable on purpose: cookies
      # YouTube rotates are saved back after a session, and a read-only file makes that
      # save raise and fail the download. Keep it `chmod 600` on the host.
      # Must exist as a FILE before `up` — Docker creates a directory in its place otherwise.
      - ./cookies.txt:/app/cookies.txt
      - ./backend:/app/backend  # Mount backend for development
      - ./backend/staticfiles:/app/backend/staticfiles
      - ./frontend/dist:/app/frontend/dist  # Mount frontend for development
    environment:
      - SW_HOST=http://localhost:8889
      - SW_USERNAME=admin
      - SW_PASSWORD=${SW_PASSWORD:?SW_PASSWORD must be set in .env}
      - POSTGRES_DB=soundwave
      - POSTGRES_USER=soundwave
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_HOST=soundwave-pg
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://${POSTGRES_USER:-soundwave}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@soundwave-pg:5432/${POSTGRES_DB:-soundwave}
      - REDIS_HOST=soundwave-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - TZ=UTC
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8889}
      - SECURE_COOKIES=${SECURE_COOKIES:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.1.80}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in environment}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      # Optional: email, HTTPS proxy, limits. Unset means the application's own default.
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-SoundWave <no-reply@localhost>}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-false}
      - SSL_REDIRECT=${SSL_REDIRECT:-False}
      - NUM_PROXIES=${NUM_PROXIES:-}
      - TOTP_ENC_KEY=${TOTP_ENC_KEY:-}
      - MIN_FREE_DISK_BYTES=${MIN_FREE_DISK_BYTES:-1073741824}
      - MAX_DOWNLOAD_BYTES=${MAX_DOWNLOAD_BYTES:-4294967296}
      - EXPORT_MAX_BYTES=${EXPORT_MAX_BYTES:-2147483648}
      - EXPORT_MIN_FREE_BYTES=${EXPORT_MIN_FREE_BYTES:-1073741824}
      - EXPORT_SYNC_MAX_BYTES=${EXPORT_SYNC_MAX_BYTES:-209715200}
      - DJANGO_ENABLE_ADMIN=${DJANGO_ENABLE_ADMIN:-false}
    depends_on:
      soundwave-pg:
        condition: service_healthy
      soundwave-redis:
        condition: service_healthy
    # Long enough for a running task to finish; anything cut off is picked up again after restart.
    stop_grace_period: 60s
    # Worker, scheduler and web logs all come here, so Docker keeps them bounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  soundwave-pg:
    image: postgres:16-alpine
    container_name: soundwave-pg
    restart: unless-stopped
    environment:
      - POSTGRES_DB=soundwave
      - POSTGRES_USER=soundwave
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundwave -d soundwave"]
      interval: 10s
      timeout: 5s
      retries: 5

  soundwave-redis:
    image: redis:alpine
    container_name: soundwave-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
  redis_data:
