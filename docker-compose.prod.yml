# Production docker-compose for users pulling from GitHub Container Registry
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  soundwave:
    container_name: soundwave
    image: ghcr.io/aiulian25/soundwave:main
    user: "1000:1000"
    ports:
      - "8889:8888"
    # Security: drop all capabilities and prevent privilege escalation
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem; only allow writes where needed
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
      - /run:noexec,nosuid,size=64m
    volumes:
      # Only mount data directories - NOT code directories
      - ./audio:/app/audio
      - ./cache:/app/cache
      - ./data:/app/data
      # Writable on purpose: yt-dlp saves the rotated YouTube session back after each
      # download, and fails the download if it cannot. Keep it `chmod 600` on the host.
      - ./cookies.txt:/app/cookies.txt
    # Resource limits to reduce DoS risk
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m
          cpus: "0.5"
    environment:
      - SW_HOST=${SW_HOST:-http://localhost:8889}
      - SW_USERNAME=${SW_USERNAME:-admin}
      - SW_PASSWORD=${SW_PASSWORD:?SW_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-soundwave}
      - POSTGRES_USER=${POSTGRES_USER:-soundwave}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_HOST=soundwave-pg
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://${POSTGRES_USER:-soundwave}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@soundwave-pg:5432/${POSTGRES_DB:-soundwave}
      - REDIS_HOST=soundwave-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - TZ=${TZ:-UTC}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8889}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      # Optional: email, HTTPS proxy, limits. Unset means the application's own default.
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-SoundWave <no-reply@localhost>}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-false}
      - SSL_REDIRECT=${SSL_REDIRECT:-False}
      - NUM_PROXIES=${NUM_PROXIES:-}
      - TOTP_ENC_KEY=${TOTP_ENC_KEY:-}
      - MIN_FREE_DISK_BYTES=${MIN_FREE_DISK_BYTES:-1073741824}
      - MAX_DOWNLOAD_BYTES=${MAX_DOWNLOAD_BYTES:-4294967296}
      - EXPORT_MAX_BYTES=${EXPORT_MAX_BYTES:-2147483648}
      - EXPORT_MIN_FREE_BYTES=${EXPORT_MIN_FREE_BYTES:-1073741824}
      - EXPORT_SYNC_MAX_BYTES=${EXPORT_SYNC_MAX_BYTES:-209715200}
      - DJANGO_ENABLE_ADMIN=${DJANGO_ENABLE_ADMIN:-false}
      - ALLOW_LOCAL_NETWORK=${ALLOW_LOCAL_NETWORK:-false}
      - SECURE_COOKIES=${SECURE_COOKIES:-auto}
      - TOKEN_EXPIRY_HOURS=${TOKEN_EXPIRY_HOURS:-168}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LASTFM_API_SECRET=${LASTFM_API_SECRET:-}
      - FANART_API_KEY=${FANART_API_KEY:-}
    depends_on:
      soundwave-pg:
        condition: service_healthy
      soundwave-redis:
        condition: service_healthy
    # Long enough for a running task to finish; anything cut off is picked up again after restart.
    stop_grace_period: 60s
    # Worker, scheduler and web logs all come here, so Docker keeps them bounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      # App joins both: `frontend` for its published port + outbound (yt-dlp/APIs),
      # `datastore` (internal) to reach ES/Postgres/Redis (DEP-04).
      - frontend
      - datastore
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/api/ping/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  soundwave-pg:
    image: postgres:16-alpine
    container_name: soundwave-pg
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-soundwave}
      - POSTGRES_USER=${POSTGRES_USER:-soundwave}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datastore

  soundwave-redis:
    image: redis:alpine
    container_name: soundwave-redis
    restart: unless-stopped
    # Security hardening for Redis
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    # Require authentication. Use `noeviction` (NOT allkeys-lru): this Redis is the
    # Celery broker + result backend (DB 0) as well as the Django cache (DB 1), and
    # Redis eviction is GLOBAL across DBs — allkeys-lru would silently evict/drop queued
    # download tasks under memory pressure. With noeviction, writes fail loudly at the
    # 200mb cap (kept below the 256m container limit) instead of losing tasks. If the cap
    # is ever hit, raise --maxmemory AND the container memory limit together, or move the
    # Django cache onto a separate Redis instance so cache pressure never touches the broker.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env} --maxmemory 200mb --maxmemory-policy noeviction
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datastore

networks:
  # Only the app is on the external network (for its published port + outbound).
  frontend:
    driver: bridge
    internal: false
  # Postgres / Redis live here only: no host reachability and NO internet egress
  # (DEP-04 — stronger than expose-only).
  datastore:
    driver: bridge
    internal: true

volumes:
  pg_data:
  redis_data:
