name: Build and Publish Docker Image

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  # Weekly rebuild so OS security patches in the base image land without a code
  # change (CNT-01). The security-scan workflow flags drift between rebuilds.
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC
  workflow_dispatch:

# Serialize publish runs per ref so a slower OLDER main push can't finish last and
# overwrite :latest with a stale image. Keyed on github.ref, so tag builds (refs/tags/v*)
# land in a separate group and are never cancelled by a main push — :X.Y.Z still publishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use docker.io for Docker Hub, ghcr.io for GitHub Container Registry
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Everything an image must pass before it can be published. build-and-push needs these, so a
  # failure anywhere here means nothing reaches the registry.
  verify-backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'True'
      DJANGO_SECRET_KEY: 'ci-test-secret-not-for-production'
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
          pip install -r requirements.txt

      - name: Models and migrations agree
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Whole backend suite
        run: python manage.py test --settings=config.settings_test

  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.node-version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npm test

  verify-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build context excludes secrets and durable data
        run: scripts/check-build-context.sh

  verify-e2e:
    uses: ./.github/workflows/e2e.yml

  build-and-push:
    needs: [verify-backend, verify-frontend, verify-context, verify-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup Docker buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Login to GitHub Container Registry
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push Docker image
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Unique per run, so the final stage's `apt-get upgrade` always re-runs and every
          # published image — :main included, which is what users pull — carries the current
          # OS security patches. Only that layer onward rebuilds; pip/npm stages stay cached.
          build-args: |
            OS_PATCH_CACHE_BUST=${{ github.run_id }}
          platforms: linux/amd64,linux/arm64
          # Published with the image, so what shipped can be examined later.
          sbom: true
          provenance: mode=max
          # Always re-pull the base image so a fresh layer is used (CNT-01).
          pull: true
          # On the weekly/manual rebuild, skip the layer cache so `apt-get upgrade`
          # actually re-runs and pulls the latest OS security patches.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      # Record exactly what was published, and scan that digest rather than a tag that can move.
      - name: Record the published image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo "Digest: \`$DIGEST\`"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the published digest
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          exit-code: '0'
          severity: CRITICAL,HIGH
